name: 定时检索并发布法律职位检索

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/jobs.json"
  schedule:
    # GitHub Actions 使用 UTC。以下对应北京时间 09:00、14:00、18:00。
    - cron: "0 1,6,10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: legal-job-radar-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 读取仓库
        uses: actions/checkout@v4

      - name: 使用 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 检索并合并职位
        run: npm run refresh

      - name: 保存最新职位快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh legal jobs"
            git push || echo "主分支已出现更新；本次继续发布当前检索结果。"
          fi

      - name: 构建静态网站
        run: npm run build

      - name: 校验发布内容
        run: npm run check

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
